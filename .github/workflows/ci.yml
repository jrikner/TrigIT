name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand (Actions > CI > Run workflow) to build the Windows spike from any branch.
  workflow_dispatch:

env:
  SWIFT_VERSION: 6.4.2

jobs:
  # The platform-free core: protocols, engine, storage (with the libltc fixtures).
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v4
      # No Package.resolved (no dependencies), so key on the manifest.
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-swift-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.swift') }}
      - run: swift test

  # Everything, including the SwiftUI app.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: swift
        run: echo "version=$(swift --version 2>&1 | head -1 | md5)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.swift') }}
      - run: swift build
      - run: swift test

  # Keeps the core portable for the Windows version (#60), and builds the
  # Windows spike for testers (docs/windows-spike.md). Pushes to main and
  # manual runs only while the repo is private, and informational: a failure
  # doesn't fail CI.
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          branch: swift-${{ env.SWIFT_VERSION }}-release
          tag: ${{ env.SWIFT_VERSION }}-RELEASE
      - run: swift build
      - run: swift test
      - name: Build the Windows spike
        run: swift build -c release --product TrigITWindows
      # The .exe plus the Swift runtime DLLs it loads, so it runs on a PC
      # without a Swift toolchain.
      - name: Package the Windows spike
        shell: pwsh
        run: |
          $out = "TrigIT-Windows"
          New-Item -ItemType Directory $out | Out-Null
          $bin = swift build -c release --show-bin-path
          Copy-Item "$bin\TrigITWindows.exe" $out
          $runtime = Split-Path (where.exe swiftCore.dll | Select-Object -First 1)
          Write-Output "Swift runtime: $runtime"
          Copy-Item "$runtime\*.dll" $out
          Copy-Item docs\windows-spike.md, docs\windows-spike-example.trigit, LICENSE, NOTICE $out
          Get-ChildItem $out | Format-Table Name, Length
      # Runs the packaged spike with no Swift on the PATH, against Art-Net
      # Timecode sent on this machine, and checks that the example Set fired.
      - name: Smoke-run the Windows spike
        shell: pwsh
        working-directory: TrigIT-Windows
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          .\TrigITWindows.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $spike = Start-Process .\TrigITWindows.exe -PassThru -NoNewWindow `
            -ArgumentList 'windows-spike-example.trigit', '--duration', '8', '--report', 'ci-smoke-report.txt'
          Start-Sleep -Seconds 2
          $udp = New-Object System.Net.Sockets.UdpClient
          $clock = [Diagnostics.Stopwatch]::StartNew()
          # Three seconds of 30 fps Art-Net Timecode from 00:00:09:00, across Song 1's start at 00:00:10:00.
          for ($n = 0; $n -lt 90; $n++) {
            $f = 270 + $n
            $packet = [byte[]](0x41, 0x72, 0x74, 0x2D, 0x4E, 0x65, 0x74, 0x00, 0x00, 0x97, 0x00, 14, 0x00, 0x00,
                               ($f % 30), ([math]::Floor($f / 30) % 60), 0, 0, 3)
            [void]$udp.Send($packet, $packet.Length, '127.0.0.1', 6454)
            while ($clock.Elapsed.TotalMilliseconds -lt ($n + 1) * 1000 / 30) { }
          }
          if (-not $spike.WaitForExit(30000)) { $spike.Kill(); throw "the spike did not stop by itself" }
          Get-Content ci-smoke-report.txt
          if (-not (Select-String -Path ci-smoke-report.txt -Pattern 'Songs fired: 1 ' -Quiet)) { throw "Song 1 did not fire" }
      - uses: actions/upload-artifact@v4
        with:
          name: TrigIT-Windows
          path: TrigIT-Windows
